<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON a Formulario Editable</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
</head>
<body>
    <div id="app" class="container mt-5">
        <h1 class="mb-4">Transformar JSON a Formulario Editable</h1>
        <div class="mb-3">
            <textarea v-model="jsonInput" class="form-control" placeholder="Pega tu JSON aquí" rows="10"></textarea>
        </div>
        <button @click="transformJson" class="btn btn-primary mb-4">Transformar</button>
        <div v-if="formData">
            <h2 class="mb-4">Formulario Editable</h2>
            <form>
                <template v-for="(value, key) in formData" :key="key">
                    <div v-if="Array.isArray(value)" class="mb-3 p-3 border border-primary rounded">
                        <h3>{{ key }}</h3>
                        <div v-for="(item, index) in value" :key="index" class="mb-3 p-2 border border-secondary rounded">
                            <h4>Ítem {{ index + 1 }}</h4>
                            <template v-for="(subValue, subKey) in item" :key="subKey">
                                <label :for="`${key}-${index}-${subKey}`" class="form-label">{{ subKey }}</label>
                                <input v-if="subValue !== null" :id="`${key}-${index}-${subKey}`" v-model="formData[key][index][subKey]" class="form-control" />
                                <input v-else :id="`${key}-${index}-${subKey}`" v-model="formData[key][index][subKey]" class="form-control" placeholder="Agregar valor" />
                            </template>
                        </div>
                    </div>
                    <div v-else-if="typeof value === 'object'" class="mb-3">
                        <h3>{{ key }}</h3>
                        <template v-for="(subValue, subKey) in value" :key="subKey">
                            <label :for="subKey" class="form-label">{{ subKey }}</label>
                            <input v-if="subValue !== null" :id="subKey" v-model="formData[key][subKey]" class="form-control" />
                            <input v-else :id="subKey" v-model="formData[key][subKey]" class="form-control" placeholder="Agregar valor" />
                        </template>
                    </div>
                    <div v-else class="mb-3">
                        <label :for="key" class="form-label">{{ key }}</label>
                        <input v-if="value !== null" :id="key" v-model="formData[key]" class="form-control" />
                        <input v-else :id="key" v-model="formData[key]" class="form-control" placeholder="Agregar valor" />
                    </div>
                </template>
            </form>
            <button @click="refreshJson" class="btn btn-secondary mt-3">Refrescar JSON</button>
        </div>
    </div>

    <script>
        new Vue({
            el: '#app',
            data: {
                jsonInput: '',
                formData: null
            },
            methods: {
                transformJson() {
                    try {
                        this.formData = JSON.parse(this.jsonInput);
                    } catch (e) {
                        alert('JSON inválido');
                    }
                },
                refreshJson() {
                    this.jsonInput = JSON.stringify(this.formData, null, 2);
                }
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
